---
layout: default 
---

<div class="container">
{%- assign items = site.data.open[page.title]  -%}
{% for item in items %}
  <div class="line">
    <input type="checkbox">
    <div class="card">
      <a class="url" href="{{item.url}}"><strong>{{item.name}}</strong></a>
      <div class="domain">{{item.domain}}</div>
      <div class="description">{{item.description|strip_html|markdownify}}</div>
      <div class="tags">{% for tag in item.tags %}<span>{{tag}}</span>{% endfor %}</div>
    </div>
  </div>
{% endfor %}
</div>
