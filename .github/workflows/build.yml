name: Build Jekyll Page

on:
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
  push:
    # paths:
    #   - "_includes/**"
    #   - "_layouts/**"
    #   - "_pages/**"
    #   - "assets/**"
    #   - "scripts/**"
    #   - ".github/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.client_payload.ref || env.GITHUB_REF_NAME }}        
      - name: Download
        run: ./scripts/download.sh
      - name: Write
        run: ./scripts/write-jekyll-data.sh data
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
